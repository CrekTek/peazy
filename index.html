<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Packing List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
  </head>
  <body>

    <header>
      <h1>✈ Packing List</h1>
      <p>Your smart holiday companion</p>
    </header>

    <div class="main">
      <div class="controls">
        <div class="card">
          <div class="card-label">Number of nights</div>
          <div class="nights-value" id="nights-display">7</div>
          <div class="night-row">
            <button class="night-btn" onclick="changeNights(-1)" aria-label="Decrease nights">−</button>
            <input type="range" min="1" max="30" value="7" step="1" id="nights-slider" oninput="setNights(+this.value)" aria-label="Nights">
            <button class="night-btn" onclick="changeNights(1)" aria-label="Increase nights">+</button>
          </div>
        </div>
        <div class="card">
          <div class="card-label">Holiday type</div>
          <div class="chips" id="chips"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">Total</div></div>
        <div class="stat"><div class="stat-num" id="s-packed">0</div><div class="stat-lbl">Packed</div></div>
        <div class="stat"><div class="stat-num" id="s-left">0</div><div class="stat-lbl">To pack</div></div>
      </div>

      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

      <div id="list"></div>

      <div class="actions">
        <button class="btn" onclick="resetAll()">↺ Reset all</button>
        <button class="btn btn-primary" onclick="exportCSV()">↓ Export CSV</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
